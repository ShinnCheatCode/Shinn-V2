name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # Bổ sung bước này để tự động tạo cấu trúc lib/main.dart nếu trên git chưa có
      - name: Create main.dart if missing
        run: |
          mkdir -p lib
          if [ ! -f "lib/main.dart" ]; then
            echo "Creating dummy main.dart..."
            echo "import 'package:flutter/material.dart'; void main() => runApp(MaterialApp(home: Scaffold(body: Center(child: Text('Shinn Cheat')))));" > lib/main.dart
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: |
          flutter build ios --release --no-pub

      - name: Package IPA (Ad-hoc / Debug building structure)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ShinnCheat.ipa Payload
          mkdir -p ../../../output
          mv ShinnCheat.ipa ../../../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: output/ShinnCheat.ipa
